<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Biblique CTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cts-red:#921F19; --cts-red-dark:#6E1712; --cts-red-light:#B8332B;
  --cream:#FBF6EE; --gold:#E3B04B; --ink:#2A1412;
  --ok:#2E8B57; --ko:#C0392B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 50% 0%,var(--cts-red-light),var(--cts-red) 45%,var(--cts-red-dark));
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden;
}
.screen{display:none;width:100%;max-width:760px;animation:fadeIn .5s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* Menu */
#menu{text-align:center;color:#fff}
#menu img{width:min(320px,80%);border-radius:12px;margin-bottom:20px}
#menu h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:1px;margin-bottom:8px}
#menu p.sub{font-size:1.15rem;opacity:.9;margin-bottom:32px}
.prize{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  padding:10px 18px;border-radius:999px;margin-bottom:32px;font-weight:700}
.btn{
  font-family:inherit;font-weight:900;font-size:1.25rem;cursor:pointer;border:none;border-radius:999px;
  padding:18px 40px;background:#fff;color:var(--cts-red);box-shadow:0 8px 0 rgba(0,0,0,.25);
  transition:transform .1s,box-shadow .1s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 18px rgba(255,255,255,0)}}

/* Quiz */
.card{background:var(--cream);border-radius:24px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700;color:var(--cts-red)}
.top img{height:44px;border-radius:6px}
.progress{height:10px;background:#e8dccb;border-radius:99px;overflow:hidden;margin-bottom:24px}
.progress div{height:100%;background:linear-gradient(90deg,var(--cts-red),var(--gold));width:0;transition:width .5s}
.question{font-size:clamp(1.25rem,3.5vw,1.6rem);font-weight:900;margin-bottom:24px;line-height:1.3}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.answers{grid-template-columns:1fr}.card{padding:20px}}
.answer{
  font-family:inherit;font-size:1.05rem;font-weight:700;text-align:left;cursor:pointer;
  background:#fff;border:3px solid #e6d6c2;border-radius:16px;padding:16px 18px;color:var(--ink);
  display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s,background .12s;
}
.answer .letter{flex:none;width:34px;height:34px;border-radius:50%;background:var(--cts-red);color:#fff;display:grid;place-items:center;font-weight:900}
.answer:hover:not(:disabled){transform:translateY(-3px);border-color:var(--cts-red)}
.answer:disabled{cursor:default}
.answer.correct{background:#e3f5ea;border-color:var(--ok)}
.answer.correct .letter{background:var(--ok)}
.answer.wrong{background:#fbe5e2;border-color:var(--ko);opacity:.65;animation:shake .4s}
.answer.wrong .letter{background:var(--ko)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Feedback overlay */
.feedback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.35);padding:16px}
.feedback.show{display:flex}
.bubble{background:#fff;border-radius:28px;padding:32px 36px;text-align:center;max-width:440px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bubble .emoji{font-size:4rem;display:block;margin-bottom:6px}
.bubble h2{font-size:2rem;font-weight:900;margin-bottom:8px}
.bubble.ok h2{color:var(--ok)} .bubble.ko h2{color:var(--ko)}
.bubble p{font-size:1.1rem;margin-bottom:20px}
.bubble .btn{background:var(--cts-red);color:#fff;font-size:1.1rem;padding:14px 30px}

/* Result */
#result .card{text-align:center}
#result img{height:70px;border-radius:8px;margin-bottom:10px}
.score{font-family:'Cormorant Garamond',serif;font-size:clamp(4.5rem,16vw,7rem);color:var(--cts-red);font-weight:700;line-height:1}
.score small{font-size:.4em;color:#9a7a6e}
.stars{font-size:2.2rem;margin:10px 0}
.comment{font-size:1.2rem;font-weight:700;margin:10px auto 26px;max-width:520px;line-height:1.45}
#result .btn{background:var(--cts-red);color:#fff}
.detail{font-size:.95rem;color:#7a5d52;margin-bottom:22px}

/* Pseudo + chrono + classement */
.name-box{margin:0 auto 22px;max-width:420px}
.name-box input{width:100%;font-family:inherit;font-size:1.2rem;font-weight:700;text-align:center;padding:14px 18px;border-radius:999px;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.95);color:var(--cts-red);outline:none}
.name-box input:focus{border-color:var(--gold)}
.name-box .err{color:#FFD9A0;font-weight:700;min-height:1.4em;margin-top:8px}
.chrono{font-variant-numeric:tabular-nums;background:var(--cts-red);color:#fff;padding:4px 12px;border-radius:999px;font-size:.95rem}
.top .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.board{background:rgba(255,255,255,.96);color:var(--ink);border-radius:20px;padding:18px 18px 10px;margin:28px auto 0;max-width:520px;text-align:left}
.board h3{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--cts-red);text-align:center;margin-bottom:4px}
.board .hint{text-align:center;font-size:.85rem;color:#8a6d62;margin-bottom:10px}
.board ol{list-style:none;max-height:300px;overflow-y:auto}
.board li{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid #eee1d2;font-weight:700}
.board li .rk{text-align:center;font-weight:900;color:var(--cts-red)}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .sc{color:#8a6d62;font-size:.9rem}
.board li .tm{font-variant-numeric:tabular-nums;color:var(--cts-red)}
.board li.me{background:#fdf0d4;border-radius:10px}
.board .empty{text-align:center;padding:14px;color:#8a6d62}
#result .board{background:#fff;border:2px solid #eee1d2;margin-top:0;margin-bottom:24px}
.saved{font-size:.95rem;font-weight:700;color:var(--ok);min-height:1.3em;margin-bottom:14px}
.saved.ko{color:var(--ko)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#fsBtn{position:fixed;top:12px;right:12px;z-index:40;font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:10px 16px;background:rgba(0,0,0,.25);color:#fff;backdrop-filter:blur(4px)}
#fsBtn:hover{background:rgba(0,0,0,.4)}
#fsTip{position:fixed;top:60px;right:12px;z-index:40;max-width:300px;background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;font-size:.9rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<button id="fsBtn" type="button">⛶ Plein écran</button>
<div id="fsTip"></div>

<script>
const QUESTIONS = [
  { q:"Comment une personne est-elle sauvée ?",
    a:["En faisant plus de bonnes actions que de mauvaises actions.",
       "Par la grâce de Dieu, en mettant sa foi en Jésus-Christ.",
       "En allant à l’église tous les dimanches, sans exception.",
       "En étant une bonne personne et en respectant toutes les règles."], c:1 },
  { q:"Pourquoi considère-t-on la Bible comme une autorité importante ?",
    a:["Parce qu’elle contient uniquement des histoires anciennes.",
       "Parce qu’elle remplace toutes les décisions personnelles.",
       "Parce qu’elle enseigne qui est Dieu et guide les croyants dans leur foi et leur manière de vivre.",
       "Parce qu’il suffit de lire quelques versets pour comprendre toutes les situations de la vie."], c:2 },
  { q:"Vrai ou faux : devenir chrétien signifie qu’on ne lutte plus jamais contre le péché et qu’on ne fait plus aucune erreur.",
    a:["Vrai","Faux"], c:1 },
  { q:"Combien d’animaux prennent la parole dans les récits bibliques ?",
    a:["1","2","3","4"], c:1 },
  { q:"« Aide-toi, et le ciel t’aidera. »",
    a:["Un verset biblique","Une sagesse populaire"], c:1 },
  { q:"« Il y a un temps pour tout, un temps pour toute chose sous les cieux. »",
    a:["Un verset biblique","Une sagesse populaire"], c:0 },
  { q:"Où se trouve le Continental Theological Seminary (CTS) ?",
    a:["France","Belgique","Suisse"], c:1 },
];

const BRAVO = ["Bravo, bonne réponse !","Excellent !","Génial, c’est ça !","Super, tu gères !"];
const BRAVO_EMOJI = ["🎉","🙌","🌟","🔥"];

let idx = 0, score = 0, firstTry = true;
let playerName = '', startTime = 0, chronoTimer = null, lastId = null;
let db = null, rows = [];

function fmt(ms){ const t=Math.floor(ms/1000); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function fmtLong(ms){ const t=Math.floor(ms/1000), m=Math.floor(t/60), s=t%60; return (m? m+' min ':'')+s+' s'; }

function renderBoard(){
  document.querySelectorAll('.boardList').forEach(ol=>{
    ol.innerHTML='';
    if(!db){ ol.innerHTML='<li class="empty" style="display:block">Classement indisponible ici.</li>'; return; }
    if(!rows.length){ ol.innerHTML='<li class="empty" style="display:block">Aucun joueur pour l’instant. Sois le premier ! 🚀</li>'; return; }
    rows.forEach((r,i)=>{
      const li=document.createElement('li');
      if(r.id===lastId) li.className='me';
      const medal=['🥇','🥈','🥉'][i]||(i+1);
      li.innerHTML='<span class="rk"></span><span class="nm"></span><span class="sc"></span><span class="tm"></span>';
      li.children[0].textContent=medal;
      li.children[1].textContent=r.name;
      li.children[2].textContent=r.score+'/100';
      li.children[3].textContent=fmt(r.timeMs);
      ol.appendChild(li);
    });
  });
}

async function initDb(){
  try { db = await window.claude?.use?.('db'); } catch(e){ db = null; }
  if(!db){ renderBoard(); return; }
  db.collection('scores').orderBy('timeMs','asc').limit(200).onSnapshot(snap=>{
    rows = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .filter(r=>typeof r.name==='string' && typeof r.timeMs==='number');
    renderBoard();
  }, ()=>{ db=null; renderBoard(); });
  renderBoard();
}
renderBoard();
initDb();
const $ = id => document.getElementById(id);

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

function start(){
  const n = $('nameInput').value.trim();
  if(!n){ $('nameErr').textContent='👉 Écris ton nom d’utilisateur pour jouer !'; $('nameInput').focus(); return; }
  $('nameErr').textContent='';
  playerName=n; idx=0; score=0; lastId=null;
  startTime=Date.now();
  $('chrono').textContent='⏱ 0:00';
  clearInterval(chronoTimer);
  chronoTimer=setInterval(()=>{ $('chrono').textContent='⏱ '+fmt(Date.now()-startTime); },250);
  show('quiz'); render();
}

function render(){
  const item = QUESTIONS[idx];
  firstTry = true;
  $('counter').textContent = `Question ${idx+1} / ${QUESTIONS.length}`;
  $('bar').style.width = (idx/QUESTIONS.length*100)+'%';
  $('question').textContent = item.q;
  const box = $('answers'); box.innerHTML='';
  item.a.forEach((txt,i)=>{
    const b = document.createElement('button');
    b.className='answer';
    b.innerHTML = `<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;
    b.lastChild.textContent = txt;
    b.onclick = () => choose(i,b);
    box.appendChild(b);
  });
}

function choose(i,btn){
  const item = QUESTIONS[idx];
  if(i===item.c){
    if(firstTry) score++;
    btn.classList.add('correct');
    document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
    const k = Math.floor(Math.random()*BRAVO.length);
    feedback(true, BRAVO_EMOJI[k], BRAVO[k],
      firstTry ? "+1 point ! Continue comme ça 💪" : "Tu as trouvé ! (pas de point cette fois, mais bien joué 😉)",
      idx===QUESTIONS.length-1 ? "Voir mon score 🏆" : "Question suivante ➜");
    confetti();
  } else {
    firstTry = false;
    btn.classList.add('wrong'); btn.disabled = true;
    feedback(false,"😅","Dommage…","Essaie encore, tu vas y arriver ! 💪","Je réessaie");
  }
}

function feedback(ok,emoji,title,text,label){
  $('bubble').className = 'bubble '+(ok?'ok':'ko');
  $('fbEmoji').textContent=emoji; $('fbTitle').textContent=title; $('fbText').textContent=text; $('fbBtn').textContent=label;
  $('fbBtn').onclick = () => {
    $('feedback').classList.remove('show');
    if(ok){ idx++; idx<QUESTIONS.length ? render() : finish(); }
  };
  $('feedback').classList.add('show');
}

async function finish(){
  clearInterval(chronoTimer);
  const timeMs = Date.now()-startTime;
  $('bar').style.width='100%';
  const pct = Math.round(score/QUESTIONS.length*100);
  show('result');
  $('detail').textContent = `${playerName} · ${score} bonne(s) réponse(s) du premier coup sur ${QUESTIONS.length} · ⏱ ${fmtLong(timeMs)}`;
  saveResult(pct, timeMs);
  const n = Math.round(pct/20);
  $('stars').textContent = '⭐'.repeat(n) + '☆'.repeat(5-n);
  let c;
  if(pct===100) c="🏆 Score parfait ! Tu es un vrai champion de la Bible ! Le livre du CTS t’attend 📚";
  else if(pct>=80) c="🌟 Impressionnant ! Tu connais vraiment bien la Bible. Bravo !";
  else if(pct>=60) c="👏 Très bien joué ! Tu as de bonnes bases, continue à creuser la Parole.";
  else if(pct>=40) c="🙂 Pas mal du tout ! Encore un peu de lecture et tu seras imbattable.";
  else c="💪 Merci d’avoir joué ! Chaque question est une occasion d’apprendre. La Bible a plein de trésors à découvrir !";
  $('comment').textContent = c;
  // animate the number
  let cur=0; const el=$('scoreNum'); el.textContent='0';
  const t=setInterval(()=>{ cur=Math.min(pct,cur+2); el.textContent=cur; if(cur>=pct) clearInterval(t); },20);
  if(pct>=60){ confetti(); setTimeout(confetti,600); }
}

/* Confetti */
const cv=$('confetti'), ctx=cv.getContext('2d'); let parts=[], running=false;
function resize(){ cv.width=innerWidth; cv.height=innerHeight; } addEventListener('resize',resize); resize();
function confetti(){
  const colors=['#921F19','#E3B04B','#ffffff','#B8332B','#2E8B57'];
  for(let i=0;i<140;i++) parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,
    s:Math.random()*8+5,c:colors[i%colors.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,life:0});
  if(!running){ running=true; requestAnimationFrame(loop); }
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
  parts = parts.filter(p=>p.y<cv.height+40 && p.life<300);
  if(parts.length) requestAnimationFrame(loop); else { running=false; ctx.clearRect(0,0,cv.width,cv.height); }
}

async function saveResult(pct, timeMs){
  const el=$('saved'); el.className='saved';
  if(!db){ el.className='saved ko'; el.textContent='⚠️ Score non enregistré (classement indisponible).'; return; }
  el.textContent='Enregistrement…';
  try{
    const ref = db.collection('scores').doc();
    lastId = ref.id; renderBoard();
    await ref.set({name:playerName, score:pct, timeMs, at:Date.now()});
    const rank = rows.findIndex(r=>r.id===lastId)+1;
    el.textContent = rank>0 ? `✅ Score enregistré ! Tu es ${rank===1?'1er':rank+'e'} au classement.` : '✅ Score enregistré !';
  }catch(e){
    lastId=null; renderBoard();
    el.className='saved ko'; el.textContent='⚠️ Impossible d’enregistrer le score sur cet appareil.';
  }
}

/* Plein écran (iPad : Safari utilise webkitRequestFullscreen) */
const root = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function updateFsBtn(){ $('fsBtn').textContent = fsEl() ? '✕ Quitter le plein écran' : '⛶ Plein écran'; }
function fsTip(msg){ const t=$('fsTip'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',6000); }
$('fsBtn').onclick = async () => {
  try{
    if(fsEl()){ await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); return; }
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if(!req) throw new Error('unsupported');
    await req.call(root);
  }catch(e){
    fsTip('Le plein écran est bloqué ici. Utilise le bouton d’agrandissement de la page Claude (en haut à droite), ou ouvre le lien dans Safari.');
  }
  setTimeout(()=>{ if(!fsEl()) fsTip('Le plein écran est bloqué ici. Utilise le bouton d’agrandissement de la page Claude (en haut à droite), ou ouvre le lien dans Safari.'); },400);
};
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

$('startBtn').onclick = start;
$('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });
$('restartBtn').onclick = () => { $('nameInput').value=''; lastId=null; renderBoard(); show('menu'); $('nameInput').focus(); };
</script>
